<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ADRA — Detector de Falla de Luz</title>

<!-- PWA: esto es lo que permite "Instalar app" / "Agregar a inicio" -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f3460" id="metaThemeColor">

<!-- Android / Chrome -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">

<!-- iOS / Safari (Apple no lee manifest.json, necesita sus propias etiquetas) -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ADRA">

<script>
  // Se ejecuta ANTES de pintar la página, para que no haya un "parpadeo"
  // del tema oscuro antes de cambiar al claro guardado previamente.
  (function () {
    try {
      if (localStorage.getItem('adra-theme') === 'light') {
        document.documentElement.classList.add('theme-light');
      }
    } catch (e) {}
  })();
</script>

<style>
  :root {
    --bg:       #1a1a2e;
    --card:     #16213e;
    --card2:    #0f3460;
    --header-1: #0f3460;
    --header-2: #16213e;
    --accent:   #e94560;
    --green:    #4ecca3;
    --yellow:   #f5a623;
    --text:     #eaeaea;
    --muted:    #8892a4;
    --border:   rgba(255,255,255,0.06);
    --radius:   16px;
    --shadow:   0 4px 24px rgba(0,0,0,0.4);
  }

  :root.theme-light {
    --bg:       #eef1f7;
    --card:     #ffffff;
    --card2:    #f3f6fc;
    --header-1: #ffffff;
    --header-2: #e7ecf7;
    --accent:   #e0314f;
    --green:    #1f9d73;
    --yellow:   #b9740a;
    --text:     #1a1a2e;
    --muted:    #6b7280;
    --border:   rgba(15,30,60,0.08);
    --radius:   16px;
    --shadow:   0 4px 24px rgba(15,30,60,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 80px;
    transition: background 0.25s ease, color 0.25s ease;
  }

  .header {
    background: linear-gradient(160deg, var(--header-1) 0%, var(--header-2) 100%);
    padding: 48px 24px 32px;
    text-align: center;
    position: relative;
    overflow: hidden;
    transition: background 0.25s ease;
  }
  .header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(233,69,96,0.15) 0%, transparent 70%);
  }
  .header-location { font-size: 13px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
  .header-status { font-size: 56px; font-weight: 300; letter-spacing: -2px; line-height: 1; margin-bottom: 8px; }
  .header-status.sin-luz { color: var(--accent); }
  .header-status.con-luz { color: var(--green); }
  .header-desc { font-size: 18px; color: var(--muted); margin-bottom: 24px; }
  .header-meta { display: flex; justify-content: center; gap: 32px; font-size: 13px; color: var(--muted); }
  .header-meta span { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .header-meta strong { color: var(--text); font-size: 15px; }

  .contador-wrap { text-align: center; padding: 16px 0 0; }
  .contador { font-size: 48px; font-weight: 200; letter-spacing: 4px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .contador-label { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .notif-banner {
    margin: 16px 16px 0;
    background: rgba(245,166,35,0.12);
    border: 1px solid rgba(245,166,35,0.3);
    border-radius: 12px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    color: var(--yellow);
    cursor: pointer;
  }
  .notif-banner.hidden { display: none; }
  .notif-icon { font-size: 20px; flex-shrink: 0; }

  .grid { padding: 16px; display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
  .card { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); transition: background 0.25s ease, box-shadow 0.25s ease; }
  .card.full { grid-column: 1 / -1; }
  .card-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
  .card-value { font-size: 28px; font-weight: 300; line-height: 1.1; }
  .card-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .dot.green { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .dot.red   { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  .pronostico-bar { margin-top: 12px; display: flex; gap: 4px; align-items: flex-end; height: 48px; }
  .pbar { flex: 1; border-radius: 4px 4px 0 0; background: var(--border); transition: height 0.6s ease; position: relative; }
  .pbar.active { background: rgba(233,69,96,0.6); }
  .pbar-label { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 9px; color: var(--muted); white-space: nowrap; }
  .pronostico-texto { margin-top: 28px; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .pronostico-confianza { margin-top: 8px; font-size: 12px; color: var(--yellow); }

  .historial-list { margin-top: 8px; }
  .historial-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .historial-item:last-child { border-bottom: none; }
  .h-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .h-icon.inicio { background: rgba(233,69,96,0.15); }
  .h-icon.fin    { background: rgba(78,204,163,0.15); }
  .h-body { flex: 1; min-width: 0; }
  .h-tipo { font-size: 13px; font-weight: 500; }
  .h-hora { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .h-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; }
  .h-dur   { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .h-hora-right { font-size: 12px; color: var(--muted); white-space: nowrap; }

  .battery-wrap { display: flex; align-items: center; gap: 16px; margin-top: 8px; }
  .battery-icon { width: 48px; height: 24px; border: 2px solid var(--muted); border-radius: 4px; position: relative; flex-shrink: 0; }
  .battery-icon::after { content: ''; position: absolute; right: -6px; top: 50%; transform: translateY(-50%); width: 4px; height: 10px; background: var(--muted); border-radius: 0 2px 2px 0; }
  .battery-fill { position: absolute; left: 2px; top: 2px; bottom: 2px; border-radius: 2px; transition: width 0.6s ease, background 0.6s ease; }
  .battery-pct { font-size: 28px; font-weight: 300; }

  .nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; padding: 8px 0 16px; transition: background 0.25s ease; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: var(--muted); cursor: pointer; padding: 6px 0; transition: color 0.2s; }
  .nav-item.active { color: var(--green); }
  .nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

  .loading { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }
  .conn-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 8px; }

  /* Animación: nueva fila se desliza desde arriba */
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .historial-item.nuevo {
    animation: slideDown 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  /* Animación: el texto grande del header cambia suavemente */
  @keyframes fadeSwap {
    0%   { opacity: 1; transform: scale(1); }
    40%  { opacity: 0; transform: scale(0.92); }
    60%  { opacity: 0; transform: scale(1.04); }
    100% { opacity: 1; transform: scale(1); }
  }
  .header-status.animando {
    animation: fadeSwap 0.5s ease both;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }

  /* SELECTOR DE TEMA */
  .theme-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 4px;
  }
  .theme-row-label { font-size: 14px; }
  .theme-row-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .theme-switch {
    position: relative;
    width: 52px;
    height: 30px;
    flex-shrink: 0;
  }
  .theme-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .theme-switch .slider {
    position: absolute;
    inset: 0;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .theme-switch .slider::before {
    content: '🌙';
    position: absolute;
    left: 3px;
    top: 3px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    line-height: 1;
    transition: transform 0.25s ease, background 0.2s ease;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }
  .theme-switch input:checked + .slider { background: var(--accent); }
  .theme-switch input:checked + .slider::before {
    transform: translateX(22px);
    content: '☀️';
  }
</style>
</head>
<body>

<div class="notif-banner" id="notifBanner" onclick="solicitarNotificaciones()">
  <span class="notif-icon">🔔</span>
  <span>Activar notificaciones para recibir alertas de cortes</span>
</div>

<div class="header">
  <div class="header-location" id="headerLocation">Cargando...</div>
  <div class="header-status" id="headerStatus">--</div>
  <div class="header-desc" id="headerDesc">Verificando estado...</div>
  <div class="contador-wrap" id="contadorWrap" style="display:none">
    <div class="contador" id="contador">00:00:00</div>
    <div class="contador-label">tiempo sin electricidad</div>
  </div>
  <div class="header-meta">
    <span><strong id="metaTotalFallas">--</strong>fallas totales</span>
    <span><strong id="metaDurMax">--</strong>máx registrada</span>
    <span><strong id="metaDurProm">--</strong>duración prom.</span>
  </div>
</div>

<div class="grid" id="mainGrid">
  <div class="loading" style="grid-column:1/-1">Cargando datos...</div>
</div>

<nav class="nav">
  <div class="nav-item active" onclick="mostrarVista('inicio')">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Inicio
  </div>
  <div class="nav-item" onclick="mostrarVista('historial')">
    <svg viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    Historial
  </div>
  <div class="nav-item" onclick="mostrarVista('estadisticas')">
    <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    Estadísticas
  </div>
  <div class="nav-item" onclick="mostrarVista('ajustes')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    Ajustes
  </div>
</nav>

<script>
// ============================================================
//  CONFIGURACIÓN — EDITAR ANTES DE DESPLEGAR
// ============================================================
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwnTl1xXlXWC5sMDfNhOe3AniATnd-6Te0TfexZTkaO1pB88Gxl6QD2ZjHOfgobdriI/exec';
const NOMBRE_DISPOSITIVO = 'ADRA';
const CIUDAD = 'Venezuela';

// Clave pública VAPID — DEBE ser exactamente la misma que configuraste
// como variable de entorno VAPID_PUBLIC_KEY en Vercel.
const VAPID_PUBLIC_KEY = 'BHLs0A9iejckHaNK3HCukLgQmI50pxJwNt7pA5R85YPg1lzo04r-fazCdrcHZlh-F9POAxfjirjRV625cdHNy90';

// ============================================================
//  ESTADO GLOBAL
// ============================================================
let datos = null;
let resumen = null;
let registrosTodos = [];   // acumula todos los eventos cargados (para "cargar más")
let paginaActual  = 1;     // página actual en el historial
let hayMasRegistros = false;
let cargandoMas   = false;
let fallaActiva = false;
let tiempoInicioFalla = null;
let intervaloContador = null;
let vistaActual = 'inicio';

document.addEventListener('DOMContentLoaded', () => {
  aplicarTema(obtenerTemaActual(), false);
  document.getElementById('headerLocation').textContent = NOMBRE_DISPOSITIVO + ' · ' + CIUDAD;
  verificarNotificaciones();
  cargarDatos();
  setInterval(cargarDatos, 60000); // refresca la UI cada 60s — el push real no depende de esto
  registrarServiceWorker();
});

// ============================================================
//  TEMA OSCURO / CLARO
// ============================================================
function obtenerTemaActual() {
  try {
    return localStorage.getItem('adra-theme') || 'dark';
  } catch (e) {
    return 'dark';
  }
}

function aplicarTema(tema, guardar) {
  const esClaro = tema === 'light';
  document.documentElement.classList.toggle('theme-light', esClaro);

  const meta = document.getElementById('metaThemeColor');
  if (meta) meta.setAttribute('content', esClaro ? '#ffffff' : '#0f3460');

  if (guardar) {
    try { localStorage.setItem('adra-theme', tema); } catch (e) {}
  }
}

function cambiarTema(checkbox) {
  aplicarTema(checkbox.checked ? 'light' : 'dark', true);
}

// ============================================================
//  CARGAR DATOS DESDE APPS SCRIPT
// ============================================================
async function cargarDatos() {
  try {
    paginaActual = 1;
    const ctrl   = new AbortController();
    const timeout = setTimeout(() => ctrl.abort(), 15000); // 15s máximo

    const [resDatos, resResumen] = await Promise.all([
      fetch(SCRIPT_URL + '?accion=obtenerDatos&pagina=1&porPagina=50', { signal: ctrl.signal }),
      fetch(SCRIPT_URL + '?accion=obtenerResumen', { signal: ctrl.signal })
    ]);
    clearTimeout(timeout);

    datos   = await resDatos.json();
    resumen = await resResumen.json();

    if (datos.status === 'OK') {
      registrosTodos  = datos.registros || [];
      hayMasRegistros = datos.hayMas || false;
      actualizarHeader();
      renderizarVista();
    } else {
      mostrarErrorCarga('El servidor respondió con un error. Intenta de nuevo.');
    }
  } catch (e) {
    const msg = e.name === 'AbortError'
      ? 'La conexión tardó demasiado (>15s). Verifica tu internet.'
      : 'No se pudo conectar con el servidor.';
    mostrarErrorCarga(msg);
    console.error('Error cargando datos:', e);
  }
}

function mostrarErrorCarga(mensaje) {
  // Actualizar el header con lo que haya (puede estar en null)
  const statusEl = document.getElementById('headerStatus');
  const descEl   = document.getElementById('headerDesc');
  if (statusEl) {
    statusEl.textContent = 'Sin conexión';
    statusEl.className   = 'header-status';
    statusEl.style.color = 'var(--muted)';
  }
  if (descEl) descEl.textContent = mensaje;

  // Mostrar mensaje en el grid con botón de reintentar
  const grid = document.getElementById('mainGrid');
  if (grid) {
    grid.innerHTML = `
      <div class="card full" style="text-align:center;padding:32px 20px">
        <div style="font-size:32px;margin-bottom:12px">⚡</div>
        <div style="font-size:15px;font-weight:500;color:var(--text);margin-bottom:8px">Sin datos</div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:24px;line-height:1.5">${mensaje}</div>
        <button onclick="cargarDatos()" style="
          background:var(--green);color:#000;border:none;border-radius:12px;
          padding:12px 28px;font-size:15px;font-weight:600;cursor:pointer;">
          Reintentar
        </button>
      </div>
    `;
  }
}

async function cargarMas() {
  if (cargandoMas || !hayMasRegistros) return;
  cargandoMas = true;

  const btnMas = document.getElementById('btnCargarMas');
  if (btnMas) btnMas.textContent = 'Cargando...';

  try {
    paginaActual++;
    const res  = await fetch(SCRIPT_URL + '?accion=obtenerDatos&pagina=' + paginaActual + '&porPagina=50');
    const json = await res.json();
    if (json.status === 'OK') {
      registrosTodos  = registrosTodos.concat(json.registros || []);
      hayMasRegistros = json.hayMas || false;
      renderHistorial(); // solo re-renderiza el historial, no toda la app
    }
  } catch (e) {
    console.error('Error cargando más:', e);
  }
  cargandoMas = false;
}

function esTipoInicio(tipo) {
  const t = (tipo || '').trim();
  return t === 'ALERTA' || t === 'FALLA_INICIO';
}

function esTipoFin(tipo) {
  const t = (tipo || '').trim();
  return t === 'CORTE' || t === 'FALLA_FIN';
}

function actualizarHeader() {
  const statusEl = document.getElementById('headerStatus');
  const descEl   = document.getElementById('headerDesc');
  const contWrap = document.getElementById('contadorWrap');

  fallaActiva = datos.fallaActiva;

  if (fallaActiva && datos.ultimaFalla) {
    statusEl.textContent = '🚨Sin Electricidad';
    statusEl.className   = 'header-status sin-luz';
    descEl.textContent   = 'Corte activo desde las ' + formatHoraCorta(datos.ultimaFalla.hora);
    contWrap.style.display = 'block';

    if (!tiempoInicioFalla) {
      tiempoInicioFalla = new Date(datos.ultimaFalla.hora.replace(' ', 'T'));
    }
    if (!intervaloContador) {
      intervaloContador = setInterval(actualizarContador, 1000);
    }
  } else {
    statusEl.textContent = '💡Hay Electricidad';
    statusEl.className   = 'header-status con-luz';

    // buscar el último corte completo (CORTE o FALLA_FIN)
    const ultimo = registrosTodos.find(r => esTipoFin(r.tipo));
    if (ultimo) {
      const durTexto = ultimo.durHMS && ultimo.durHMS !== '-' && ultimo.durHMS !== '0h 0m 0s'
        ? ' · ' + ultimo.durHMS : '';
      descEl.textContent = formatFechaCorta(ultimo.hora) + durTexto;
    } else {
      descEl.textContent = 'Sin fallas registradas';
    }

    contWrap.style.display = 'none';
    tiempoInicioFalla = null;
    if (intervaloContador) { clearInterval(intervaloContador); intervaloContador = null; }
  }

  if (resumen && resumen.resumen) {
    const r = resumen.resumen;
    document.getElementById('metaTotalFallas').textContent = r.totalFallas || '0';
    document.getElementById('metaDurMax').textContent      = r.duracionMaxima || '--';
    document.getElementById('metaDurProm').textContent     = r.duracionPromedio || '--';
  }
}

function actualizarContador() {
  if (!tiempoInicioFalla) return;
  const diff = Math.floor((Date.now() - tiempoInicioFalla.getTime()) / 1000);
  const h = Math.floor(diff / 3600);
  const m = Math.floor((diff % 3600) / 60);
  const s = diff % 60;
  document.getElementById('contador').textContent =
    String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

// ============================================================
//  RENDERIZADO DE VISTAS (igual que antes)
// ============================================================
function renderizarVista() {
  if (vistaActual === 'inicio')            renderInicio();
  else if (vistaActual === 'historial')    renderHistorial();
  else if (vistaActual === 'estadisticas') renderEstadisticas();
  else if (vistaActual === 'ajustes')      renderAjustes();
}

function renderInicio() {
  const grid = document.getElementById('mainGrid');
  const bat  = calcularBateria();
  const r    = resumen && resumen.resumen ? resumen.resumen : {};
  const pro  = r.pronostico || {};

  grid.innerHTML = `
    <div class="card">
      <div class="card-label">Batería del dispositivo</div>
      <div class="battery-wrap">
        <div class="battery-icon">

// ============================================================
//  HELPERS DE SEMANA ISO
// ============================================================
function getISOWeek(d) {
  const date = new Date(d);
  date.setHours(0,0,0,0);
  date.setDate(date.getDate() + 4 - (date.getDay() || 7));
  const yearStart = new Date(date.getFullYear(), 0, 1);
  const wk = Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
  return date.getFullYear() + '-W' + String(wk).padStart(2,'0');
}

function buildWeeklyData() {
  const weekMap = new Map();
  const cortes  = buildCorteRows(registrosTodos);
  for (const r of cortes) {
    const d = parsearFecha(r.hora);
    if (!d) continue;
    const key = getISOWeek(d);
    if (!weekMap.has(key)) weekMap.set(key, { key, count: 0, totalSeg: 0, events: [] });
    const e = weekMap.get(key);
    e.count++;
    e.totalSeg += (parseInt(r.durSeg) || 0);
    e.events.push(r);
  }
  return Array.from(weekMap.values()).sort((a,b) => a.key.localeCompare(b.key));
}

// ── Gráfica 1: heatmap día × franja horaria ─────────────────
function graficaBarrasSemanal() {
  // Muestra la semana actual como heatmap: columnas=días, filas=franjas horarias
  // Verde = con luz, Rojo = hubo corte en esa franja, Gris = sin datos aún
  const ahora   = new Date();
  const semana  = getISOWeek(ahora);
  const lunes   = new Date(ahora);
  lunes.setHours(0, 0, 0, 0);
  lunes.setDate(lunes.getDate() - ((lunes.getDay() || 7) - 1));
  const lunesMs = lunes.getTime();

  const eventosSemana = registrosTodos.filter(r => {
    const d = parsearFecha(r.hora);
    return d && getISOWeek(d) === semana;
  });

  // Matriz 7 días × 4 franjas
  const matrix = Array.from({ length: 7 }, () => Array(4).fill(0));
  const diasConDatos = new Set();
  for (const ev of eventosSemana) {
    const d = parsearFecha(ev.hora);
    if (!d) continue;
    const dia = Math.floor((d.getTime() - lunesMs) / 86400000);
    if (dia >= 0 && dia <= 6) diasConDatos.add(dia);
  }
  for (const dia of diasConDatos) for (let b = 0; b < 4; b++) matrix[dia][b] = 1;

  const hsCubiertas = new Set();
  for (const ev of eventosSemana) {
    const tipo = (ev.tipo || '').trim();
    if (tipo !== 'CORTE' && tipo !== 'FALLA_FIN') continue;
    const dS = parsearFecha(ev.hora);
    if (!dS) continue;
    const dE = ev.notas && ev.notas.length >= 10 ? parsearFecha(ev.notas) : null;
    const finMs = dE ? dE.getTime() : dS.getTime() + 3600000;
    let cur = new Date(dS); cur.setMinutes(0, 0, 0);
    while (cur.getTime() <= finMs) {
      const dia = Math.floor((cur.getTime() - lunesMs) / 86400000);
      if (dia >= 0 && dia <= 6) {
        matrix[dia][Math.floor(cur.getHours() / 6)] = 2;
        hsCubiertas.add(dia + '_' + cur.getHours());
      }
      cur.setHours(cur.getHours() + 1);
    }
  }
  for (const ev of eventosSemana) {
    const tipo = (ev.tipo || '').trim();
    if (tipo !== 'ALERTA' && tipo !== 'FALLA_INICIO') continue;
    const dS = parsearFecha(ev.hora);
    if (!dS) continue;
    const dia = Math.floor((dS.getTime() - lunesMs) / 86400000);
    if (dia < 0 || dia > 6) continue;
    if (hsCubiertas.has(dia + '_' + dS.getHours())) continue;
    matrix[dia][Math.floor(dS.getHours() / 6)] = 2;
  }

  const W = 300, H = 96, PL = 28, PR = 4, PT = 18, PB = 10;
  const cw = (W - PL - PR) / 7, ch = (H - PT - PB) / 4;
  const DIAS = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const BLOQUES = ['00h','06h','12h','18h'];

  let cells = '', dayLabels = '', timeLabels = '';
  for (let d = 0; d < 7; d++) {
    dayLabels += `<text x="${(PL + d*cw + cw/2).toFixed(1)}" y="${PT-5}" font-size="8" fill="rgba(255,255,255,0.5)" text-anchor="middle">${DIAS[d]}</text>`;
    for (let b = 0; b < 4; b++) {
      const x = PL + d*cw, y = PT + b*ch;
      const fill = matrix[d][b] === 2 ? 'rgba(233,69,96,0.85)'
                 : matrix[d][b] === 1 ? 'rgba(78,204,163,0.72)'
                 : 'rgba(128,128,128,0.12)';
      cells += `<rect x="${(x+1.5).toFixed(1)}" y="${(y+1.5).toFixed(1)}" width="${(cw-3).toFixed(1)}" height="${(ch-3).toFixed(1)}" rx="3" fill="${fill}"/>`;
    }
  }
  for (let b = 0; b < 4; b++) {
    timeLabels += `<text x="${PL-3}" y="${(PT + b*ch + ch/2 + 3).toFixed(1)}" font-size="7" fill="rgba(255,255,255,0.4)" text-anchor="end">${BLOQUES[b]}</text>`;
  }

  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%">
    ${dayLabels}${timeLabels}${cells}
  </svg>`;
}

// ── Gráfica 2: senoidal semanal (semana actual) ─────────────
function graficaSemana() {
  const ahora = new Date();
  const semanaActual = getISOWeek(ahora);
  const lunes = new Date(ahora);
  lunes.setHours(0,0,0,0);
  lunes.setDate(lunes.getDate() - ((lunes.getDay() || 7) - 1));

  const eventosSemana = registrosTodos.filter(r => {
    const d = parsearFecha(r.hora);
    return d && getISOWeek(d) === semanaActual;
  });

  const periodosCorte = [];
  const horasCubiertas = new Set();
  for (const ev of eventosSemana) {
    const tipo = (ev.tipo || '').trim();
    if (tipo === 'CORTE' || tipo === 'FALLA_FIN') {
      const dS = parsearFecha(ev.hora);
      const dE = ev.notas && ev.notas.length >= 10 ? parsearFecha(ev.notas) : null;
      if (!dS) continue;
      const ini = (dS - lunes) / (7 * 24 * 3600000);
      const fin = dE ? (dE - lunes) / (7 * 24 * 3600000) : Math.min(ini + 0.003, 1);
      periodosCorte.push({ ini: Math.max(0, ini), fin: Math.min(1, fin) });
      horasCubiertas.add(Math.floor((dS - lunes) / 3600000));
    }
  }
  for (const ev of eventosSemana) {
    const tipo = (ev.tipo || '').trim();
    if (tipo === 'ALERTA' || tipo === 'FALLA_INICIO') {
      const dS = parsearFecha(ev.hora);
      if (!dS) continue;
      const hOffset = Math.floor((dS - lunes) / 3600000);
      if (horasCubiertas.has(hOffset)) continue;
      const ini = (dS - lunes) / (7 * 24 * 3600000);
      periodosCorte.push({ ini: Math.max(0, ini), fin: Math.min(ini + 0.003, 1) });
    }
  }

  const W = 300, H = 90, PL = 28, PR = 8, PT = 6, PB = 22;
  const pw = W - PL - PR, ph = H - PT - PB;
  const Y_PEAK = 160, yCtr = PT + ph / 2, yScale = (ph / 2) / Y_PEAK;
  const yPos = v => yCtr - v * yScale;
  const CYCLES = 21, SAMPLES = 400;

  let path = '';
  for (let i = 0; i <= SAMPLES; i++) {
    const t = i / SAMPLES;
    const x = PL + t * pw;
    const enCorte = periodosCorte.some(p => t >= p.ini && t <= p.fin);
    const amp = enCorte ? 0 : 110 * Math.SQRT2;
    const v = amp * Math.sin(2 * Math.PI * CYCLES * t);
    const y = Math.max(PT, Math.min(PT+ph, yPos(v)));
    path += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
  }

  const DIAS_CORTOS = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  let dayLabels = '', dayLines = '', rects = '';
  for (let d = 0; d <= 7; d++) {
    const x = PL + (d/7)*pw;
    if (d < 7) dayLabels += `<text x="${(x + pw/14).toFixed(1)}" y="${H-5}" font-size="7" fill="rgba(255,255,255,0.4)" text-anchor="middle">${DIAS_CORTOS[d]}</text>`;
    if (d > 0 && d < 7) dayLines += `<line x1="${x.toFixed(1)}" y1="${PT}" x2="${x.toFixed(1)}" y2="${PT+ph}" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>`;
  }
  for (const p of periodosCorte) {
    const x = PL + p.ini * pw;
    const w = Math.max((p.fin - p.ini) * pw, 3);
    rects += `<rect x="${x.toFixed(1)}" y="${PT}" width="${w.toFixed(1)}" height="${ph}" fill="rgba(233,69,96,0.25)" rx="1"/>`;
  }

  const yCtrS = yCtr.toFixed(1);
  const noData = periodosCorte.length === 0 && eventosSemana.length === 0;

  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%">
    <line x1="${PL}" y1="${PT}"    x2="${PL}"   y2="${PT+ph}" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="${PL}" y1="${PT+ph}" x2="${W-PR}"  y2="${PT+ph}" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="${PL}" y1="${yCtrS}" x2="${W-PR}"  y2="${yCtrS}" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    ${dayLines}${rects}
    <path d="${path.trim()}" fill="none" stroke="${noData ? 'rgba(78,204,163,0.3)' : '#4ecca3'}" stroke-width="1.3" stroke-linejoin="round"/>
    ${dayLabels}
    <text x="${PL-4}" y="${PT+6}"   font-size="7" fill="rgba(255,255,255,0.35)" text-anchor="end">+${Y_PEAK}V</text>
    <text x="${PL-4}" y="${yCtr+3}" font-size="7" fill="rgba(255,255,255,0.3)"  text-anchor="end">0V</text>
    <text x="${PL-4}" y="${PT+ph}"  font-size="7" fill="rgba(255,255,255,0.35)" text-anchor="end">-${Y_PEAK}V</text>
  </svg>`;
}

// ============================================================
//  FILA UNIFICADA DE CORTE — agrupa ALERTA + CORTE en una sola fila
// ============================================================

/**
 * A partir de registrosTodos, devuelve una lista donde cada elemento
 * representa UN corte completo:
 *  - CORTE (tiene toda la info: inicio, fin, duración) → se usa directamente
 *  - ALERTA sin CORTE correspondiente → se muestra como "en curso"
 * Los ALERTA que ya tienen su CORTE se omiten (el CORTE los representa).
 */
function esTipoAnomalia(tipo) {
  const t = (tipo || '').trim();
  return t === 'BAJON' || t === 'SUBIDA';
}

function buildCorteRows(registros) {
  const cubiertas  = new Set();
  const cortes     = [];
  const alertas    = [];
  const anomalias  = [];

  for (const r of registros) {
    const t = (r.tipo || '').trim();
    if (esTipoFin(t))    { cortes.push(r);   cubiertas.add(r.hora.toString().substring(0, 16)); }
    else if (esTipoInicio(t)) alertas.push(r);
    else if (esTipoAnomalia(t)) anomalias.push(r);
  }

  const alertasSinCorte = alertas.filter(a => !cubiertas.has(a.hora.toString().substring(0, 16)));

  return [...cortes, ...alertasSinCorte, ...anomalias].sort((a, b) => {
    const da = parsearFecha(a.hora), db = parsearFecha(b.hora);
    if (!da || !db) return 0;
    return db - da;
  });
}

function itemCorte(r) {
  const tipo      = (r.tipo || '').trim();
  const esInicio  = esTipoInicio(tipo);
  const esFin     = esTipoFin(tipo);
  const esBajon   = tipo === 'BAJON';
  const esSubida  = tipo === 'SUBIDA';
  const enCurso   = esInicio && !esFin;
  const fecha     = formatFechaCorta(r.hora);
  const duracion  = (r.durHMS && r.durHMS !== '-' && r.durHMS !== '0h 0m 0s') ? r.durHMS : '';

  // Para BAJON/SUBIDA: mostrar el voltaje del campo notas
  const voltaje   = (esBajon || esSubida) && r.notas && r.notas.match(/[\d.]+V/)
    ? r.notas.match(/([\d.]+V)/)[1] : '';

  // Para CORTE: hora de retorno desde notas
  const horaEvento = esFin && r.notas && r.notas.length >= 10
    ? formatHoraCorta(r.notas)
    : formatHoraCorta(r.hora);

  // Etiqueta, color e ícono según tipo
  const etiqueta = esBajon   ? 'Bajón de luz'
                 : esSubida  ? 'Subida de luz'
                 : enCurso   ? 'Corte en curso'
                 : 'Corte de luz';

  const color = esBajon  ? 'var(--accent)'
              : esSubida ? 'var(--accent)'
              : enCurso  ? 'var(--yellow)'
              : 'var(--green)';

  const icono = esBajon  ? '📉'
              : esSubida ? '📈'
              : '⚡';

  const claseIcon = (esBajon || esSubida) ? 'inicio' : 'inicio';

  // Columna derecha: voltaje para anomalías, duración para cortes
  const derechaSup = esBajon || esSubida ? voltaje : (duracion || (enCurso ? 'En curso' : ''));
  const derechaInf = esBajon || esSubida ? horaEvento : horaEvento;

  return `
    <div class="historial-item" onclick="abrirDetalle(${r.n})">
      <div class="h-icon ${claseIcon}">${icono}</div>
      <div class="h-body">
        <div class="h-tipo" style="color:${color}">${etiqueta}</div>
        <div class="h-hora">${fecha}</div>
      </div>
      <div class="h-right">
        ${derechaSup ? `<div class="h-dur" style="${(esBajon||esSubida)?'color:var(--accent)':''}">${derechaSup}</div>` : ''}
        <div class="h-hora-right">${derechaInf}</div>
      </div>
    </div>
  `;
}
// ============================================================
//  AGRUPACIÓN POR FECHA
// ============================================================

/** Agrupa los cortes unificados por fecha (un elemento por día). */
function buildDateRows(cortes) {
  const mapaFechas = new Map();
  for (const r of cortes) {
    const d = parsearFecha(r.hora);
    if (!d) continue;
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    if (!mapaFechas.has(key)) {
      mapaFechas.set(key, { fechaKey: key, primeraHora: r.hora, cortes: [], totalSeg: 0 });
    }
    const entry = mapaFechas.get(key);
    entry.cortes.push(r);
    entry.totalSeg += (parseInt(r.durSeg) || 0);
  }
  return Array.from(mapaFechas.values());
}

/** Renderiza una fila de fecha (una por día). */
function itemFecha(fechaData) {
  const fecha = formatFechaCorta(fechaData.primeraHora);
  const count = fechaData.cortes.length;
  const h = Math.floor(fechaData.totalSeg / 3600);
  const m = Math.floor((fechaData.totalSeg % 3600) / 60);
  const s = fechaData.totalSeg % 60;
  const totalStr = fechaData.totalSeg > 0 ? h + 'h ' + m + 'm ' + s + 's' : '--';

  return `
    <div class="historial-item" onclick="abrirDetalleFecha('${fechaData.fechaKey}')">
      <div class="h-icon inicio">⚡</div>
      <div class="h-body">
        <div class="h-tipo" style="color:var(--green)">${fecha}</div>
        <div class="h-hora">${count} ${count === 1 ? 'corte registrado' : 'cortes registrados'}</div>
      </div>
      <div class="h-right">
        <div class="h-dur" style="color:var(--accent)">${totalStr}</div>
      </div>
    </div>
  `;
}

/** Abre el panel completo de un día mostrando todos los cortes. */
function abrirDetalleFecha(fechaKey) {
  const todosCortes       = buildCorteRows(registrosTodos);
  const cortesDelDia      = todosCortes.filter(r => {
    const d   = parsearFecha(r.hora);
    if (!d) return false;
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    return key === fechaKey;
  });
  const todosEventosDelDia = registrosTodos.filter(r => {
    const d   = parsearFecha(r.hora);
    if (!d) return false;
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    return key === fechaKey;
  });

  // Si el día visto coincide con el heartbeat más reciente, inyectarlo como
  // punto de voltaje para que la gráfica muestre datos reales.
  // El heartbeat viene en datos.heartbeat y NO está en el Sheet.
  if (datos && datos.heartbeat && datos.heartbeat.hora && datos.heartbeat.voltaje) {
    const hbD = parsearFecha(datos.heartbeat.hora);
    if (hbD) {
      const hbKey = hbD.getFullYear() + '-' + String(hbD.getMonth()+1).padStart(2,'0') + '-' + String(hbD.getDate()).padStart(2,'0');
      if (hbKey === fechaKey) {
        todosEventosDelDia.push({
          n: -1, tipo: 'HEARTBEAT',
          hora: datos.heartbeat.hora,
          notas: datos.heartbeat.voltaje,
          durSeg: 0, durHMS: '-'
        });
      }
    }
  }

  if (cortesDelDia.length === 0) return;

  const dRef = parsearFecha(cortesDelDia[0].hora);
  const MESES_LARGO = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const fechaTitulo = dRef ? dRef.getDate() + ' ' + MESES_LARGO[dRef.getMonth()] : '--';
  const hora        = dRef ? dRef.getHours() : 12;

  const totalSeg = cortesDelDia.reduce((s, r) => s + (parseInt(r.durSeg) || 0), 0);
  const th = Math.floor(totalSeg / 3600), tm = Math.floor((totalSeg % 3600) / 60);
  const totalStr = totalSeg > 0 ? th + 'h ' + tm + 'm' : '--';

  const listaCortes = cortesDelDia.map(r => {
    const horaIni = formatHoraCorta(r.hora);
    const horaFin = esTipoFin(r.tipo) && r.notas && r.notas.length >= 10 ? formatHoraCorta(r.notas) : '--';
    const dur     = (r.durHMS && r.durHMS !== '-' && r.durHMS !== '0h 0m 0s') ? r.durHMS : '--';
    return `
      <div onclick="abrirDetalleHistorial(${r.n})" style="
        display:flex;justify-content:space-between;align-items:center;
        background:rgba(0,0,0,0.2);border-radius:10px;padding:10px 14px;
        margin-bottom:8px;cursor:pointer;border:1px solid rgba(255,255,255,0.1);
      ">
        <div>
          <div style="font-size:13px;font-weight:600;color:#fff;">⚡ Corte de luz</div>
          <div style="font-size:11px;color:rgba(255,255,255,0.5);margin-top:2px;">
            ${horaIni} → <span style="color:#4ecca3;">${horaFin}</span>
          </div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:13px;color:rgba(255,255,255,0.8);">${dur}</div>
          <div style="font-size:11px;color:rgba(255,255,255,0.35);">Evento #${r.n}</div>
        </div>
      </div>
    `;
  }).join('');

  let overlay = document.getElementById('detalleOverlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'detalleOverlay';
    document.body.appendChild(overlay);
  }
  overlay.style.cssText = 'position:fixed;inset:0;z-index:999;overflow-y:auto;-webkit-overflow-scrolling:touch;';
  document.body.style.overflow = 'hidden';

  overlay.innerHTML = `
    <div style="min-height:100vh;background:${cielo(hora)};position:relative;">
      <div style="position:fixed;bottom:0;left:0;right:0;z-index:0;pointer-events:none;height:55vh;">${ciudadSVG(hora)}</div>
      <div style="position:relative;z-index:1;padding-bottom:32px;">

        <!-- Header -->
        <div style="display:flex;align-items:center;justify-content:space-between;padding:48px 20px 16px;background:linear-gradient(to bottom,rgba(0,0,0,0.45) 0%,transparent 100%);">
          <div style="font-size:24px;font-weight:800;color:#fff;">${fechaTitulo}</div>
          <div style="font-size:15px;color:rgba(255,255,255,0.75);font-weight:500;">Historial del Día</div>
          <button onclick="cerrarDetalle()" style="background:rgba(255,255,255,0.2);backdrop-filter:blur(8px);border:none;border-radius:20px;padding:6px 14px;color:#fff;font-size:13px;cursor:pointer;">✕</button>
        </div>

        <!-- Resumen del día -->
        <div style="margin:0 16px 16px;background:rgba(255,255,255,0.13);backdrop-filter:blur(14px);border-radius:18px;padding:18px;border:1px solid rgba(255,255,255,0.22);">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center;">
            <div style="background:rgba(0,0,0,0.2);border-radius:10px;padding:12px 6px;">
              <div style="font-size:9px;letter-spacing:1px;color:rgba(255,255,255,0.5);margin-bottom:6px;">CORTES</div>
              <div style="font-size:32px;font-weight:800;color:#fff;">${cortesDelDia.length}</div>
            </div>
            <div style="background:rgba(0,0,0,0.2);border-radius:10px;padding:12px 6px;">
              <div style="font-size:9px;letter-spacing:1px;color:rgba(255,255,255,0.5);margin-bottom:6px;">TIEMPO SIN LUZ</div>
              <div style="font-size:22px;font-weight:700;color:#e94560;">${totalStr}</div>
            </div>
          </div>
        </div>

        <!-- Lista de cortes del día -->
        <div style="margin:0 16px 16px;">
          <div style="font-size:10px;letter-spacing:1.5px;color:rgba(255,255,255,0.5);margin-bottom:8px;">CORTES DEL DÍA</div>
          ${listaCortes}

        <!-- Gráfica -->
        <div style="margin:0 16px 16px;">

          <div style="background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border-radius:14px;padding:16px;border:1px solid rgba(255,255,255,0.1);">
            ${graficaDia(todosEventosDelDia)}

        <div style="margin:0 16px 16px;background:rgba(0,0,0,0.28);backdrop-filter:blur(10px);border-radius:14px;padding:16px;border:1px solid rgba(255,255,255,0.1);">

        </div>

        <div style="margin:0 16px;">
          <button onclick="cerrarDetalle()" style="width:100%;padding:16px;background:rgba(255,255,255,0.15);backdrop-filter:blur(8px);color:#fff;border:1px solid rgba(255,255,255,0.2);border-radius:14px;font-size:16px;cursor:pointer;font-weight:500;">Cerrar</button>
        </div>
      </div>
    </div>
  `;
}

// ── HELPERS DEL PANEL HISTORIAL ──────────────────────────────

function cielo(hora) {
  if (hora >= 5  && hora < 8)  return 'linear-gradient(180deg,#f4a261 0%,#e9c46a 40%,#90b4ce 100%)';
  if (hora >= 8  && hora < 17) return 'linear-gradient(180deg,#1e6091 0%,#2980b9 40%,#5dade2 100%)';
  if (hora >= 17 && hora < 20) return 'linear-gradient(180deg,#922b21 0%,#c0392b 25%,#e67e22 55%,#2c3e50 100%)';
  return 'linear-gradient(180deg,#0a0a2e 0%,#12123e 45%,#1c2a4a 100%)';
}

function ciudadSVG(hora) {
  const noche = !(hora >= 8 && hora < 17);
  const bld   = noche ? '#0c1a28' : '#1a2e40';
  const win   = noche ? 'rgba(255,240,160,0.75)' : 'rgba(255,255,200,0.2)';
  const op    = noche ? 0.9 : 0.5;
  return `<svg width="100%" height="100%" viewBox="0 0 400 300" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">

function timelineHTML(eventosDelDia) {
  // Construir mapa hora → evento (para CORTE, marcar todo el rango inicio-fin)
  const mapaHoras = {};
  for (const ev of eventosDelDia) {
    const d = parsearFecha(ev.hora);
    if (!d) continue;
    const hIni = d.getHours();
    if (esTipoFin(ev.tipo) && ev.notas && ev.notas.length >= 10) {
      const dF = parsearFecha(ev.notas);
      const hFin = dF ? dF.getHours() : hIni;
      for (let h = hIni; h <= hFin; h++) {
        if (!mapaHoras[h]) mapaHoras[h] = { tipo: 'corte', dur: h === hFin ? ev.durHMS : '' };
      }
    } else if (esTipoInicio(ev.tipo)) {
      if (!mapaHoras[hIni]) mapaHoras[hIni] = { tipo: 'alerta', dur: '' };
    }
  }

  let html = '';
  for (let h = 0; h < 24; h++) {
    const t1 = String(h).padStart(2,'0') + ':00';
    const t2 = String((h+1) % 24).padStart(2,'0') + ':00';
    const ev = mapaHoras[h];
    if (!ev) {
      html += `<div style="display:flex;align-items:center;padding:7px 14px;border-bottom:1px solid rgba(255,255,255,0.05);">
        <span style="font-size:12px;color:rgba(255,255,255,0.35);width:110px;flex-shrink:0;">${t1} - ${t2}</span>
      </div>`;
    } else {
      const bg  = ev.tipo === 'corte' ? 'rgba(233,69,96,0.22)' : 'rgba(230,126,34,0.22)';
      const cbg = ev.tipo === 'corte' ? '#e94560' : '#e67e22';
      const lbl = ev.tipo === 'corte' ? 'Corte Detectado' : 'Alerta';
      html += `<div style="display:flex;align-items:center;padding:7px 14px;border-bottom:1px solid rgba(255,255,255,0.05);background:${bg};">
        <span style="font-size:12px;color:rgba(255,255,255,0.5);width:110px;flex-shrink:0;">${t1} - ${t2}</span>
        <div style="flex:1;background:${cbg};border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:12px;font-weight:600;color:#fff;">${lbl}</span>
          ${ev.dur && ev.dur !== '-' ? `<span style="font-size:11px;color:rgba(255,255,255,0.8);">${ev.dur}</span>` : ''}
        </div>
      </div>`;
    }
  }
  return html;
}

function graficaDia(eventosDelDia) {
  const W = 320, H = 120, PL = 32, PR = 8, PT = 6, PB = 22;
  const pw = W - PL - PR, ph = H - PT - PB;

  // ── Escala bipolar ±160V ──────────────────────────────────
  const Y_PEAK = 160;
  const yCtr   = PT + ph / 2;
  const yScale = (ph / 2) / Y_PEAK;
  const yPos   = v => yCtr - v * yScale;

  // ── Puntos de voltaje reales (HEARTBEAT / ALERTA) ─────────
  const puntosVoltaje = [];
  for (const ev of eventosDelDia) {
    const tipo = (ev.tipo || '').trim();
    if (tipo === 'HEARTBEAT' || tipo === 'ALERTA') {
      const d = parsearFecha(ev.hora);
      if (!d) continue;
      const match = (ev.notas || '').match(/(\d+(?:\.\d+)?)V/);
      if (match) {
        const t = (d.getHours() * 60 + d.getMinutes()) / 1440;
        puntosVoltaje.push({ t, v: parseFloat(match[1]) });
      }
    }
  }
  puntosVoltaje.sort((a, b) => a.t - b.t);
  const tieneVoltaje = puntosVoltaje.length > 0;

  // ── Periodos de corte (sin duplicados ALERTA+CORTE) ───────
  const periodosCorte = [];
  const horasCubiertas = new Set();
  for (const ev of eventosDelDia) {
    const tipo = (ev.tipo || '').trim();
    if (tipo === 'CORTE' || tipo === 'FALLA_FIN') {
      const dS = parsearFecha(ev.hora);
      const dE = ev.notas && ev.notas.length >= 10 ? parsearFecha(ev.notas) : null;
      if (!dS) continue;
      const ini = (dS.getHours() * 60 + dS.getMinutes()) / 1440;
      const fin = dE ? (dE.getHours() * 60 + dE.getMinutes()) / 1440 : Math.min(ini + 0.03, 1);
      periodosCorte.push({ ini, fin });
      horasCubiertas.add(dS.getHours());
    }
  }
  for (const ev of eventosDelDia) {
    const tipo = (ev.tipo || '').trim();
    if (tipo === 'ALERTA' || tipo === 'FALLA_INICIO') {
      const dS = parsearFecha(ev.hora);
      if (!dS || horasCubiertas.has(dS.getHours())) continue;
      const ini = (dS.getHours() * 60 + dS.getMinutes()) / 1440;
      periodosCorte.push({ ini, fin: Math.min(ini + 0.02, 1) });
    }
  }

  // ── Fondo de cortes (rectángulos rojos) ───────────────────
  let rects = '';
  for (const p of periodosCorte) {
    const x = PL + p.ini * pw;
    const w = Math.max((p.fin - p.ini) * pw, 3);
    rects += `<rect x="${x.toFixed(1)}" y="${PT}" width="${w.toFixed(1)}" height="${ph}" fill="rgba(233,69,96,0.22)" rx="2"/>`;
  }

  // ── Onda senoidal (45 ciclos representativos) ─────────────
  const NUM_CYCLES = 45;
  const SAMPLES    = 500;
  const TWO_PI_N   = 2 * Math.PI * NUM_CYCLES;

  function voltajeRMS(t) {
    if (!tieneVoltaje || puntosVoltaje.length === 0) return 110;
    if (puntosVoltaje.length === 1) return puntosVoltaje[0].v;
    let antes = null, despues = null;
    for (const p of puntosVoltaje) {
      if (p.t <= t) antes = p;
      if (p.t >= t && !despues) despues = p;
    }
    if (antes && despues && antes !== despues) {
      return antes.v + (despues.v - antes.v) * (t - antes.t) / (despues.t - antes.t);
    }
    return (antes || despues).v;
  }

  let path = '';
  for (let i = 0; i <= SAMPLES; i++) {
    const t = i / SAMPLES;
    const x = PL + t * pw;
    const enCorte = periodosCorte.some(p => t >= p.ini && t <= p.fin);
    // Ligera variación de amplitud (±1%) para aspecto más natural
    const variation = 1 + Math.sin(i * 0.41) * 0.01;
    const ampPeak = enCorte ? 0 : voltajeRMS(t) * Math.SQRT2 * variation;
    const v = ampPeak * Math.sin(TWO_PI_N * t);
    const y = Math.max(PT, Math.min(PT + ph, yPos(v)));
    path += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
  }

  // ── Referencias ───────────────────────────────────────────
  const yCtrStr = yCtr.toFixed(1);
  let refs = `<line x1="${PL}" y1="${yCtrStr}" x2="${W-PR}" y2="${yCtrStr}" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>`;
  const y90p  = yPos( 90 * Math.SQRT2).toFixed(1);
  const y90n  = yPos(-90 * Math.SQRT2).toFixed(1);
  const y125p = yPos(125 * Math.SQRT2).toFixed(1);
  const y125n = yPos(-125 * Math.SQRT2).toFixed(1);
  refs += `<line x1="${PL}" y1="${y90p}"  x2="${W-PR}" y2="${y90p}"  stroke="rgba(245,166,35,0.5)"  stroke-width="1" stroke-dasharray="3,3"/>`;
  refs += `<line x1="${PL}" y1="${y90n}"  x2="${W-PR}" y2="${y90n}"  stroke="rgba(245,166,35,0.5)"  stroke-width="1" stroke-dasharray="3,3"/>`;
  refs += `<line x1="${PL}" y1="${y125p}" x2="${W-PR}" y2="${y125p}" stroke="rgba(233,69,96,0.5)"   stroke-width="1" stroke-dasharray="3,3"/>`;
  refs += `<line x1="${PL}" y1="${y125n}" x2="${W-PR}" y2="${y125n}" stroke="rgba(233,69,96,0.5)"   stroke-width="1" stroke-dasharray="3,3"/>`;

  // Puntos de medición reales
  let dots = '';
  if (tieneVoltaje) {
    for (const p of puntosVoltaje) {
      const cx = PL + p.t * pw;
      const cy = yCtr;
      dots += `<circle cx="${cx.toFixed(1)}" cy="${cy}" r="2" fill="#4ecca3" opacity="0.7"/>`;
    }
  }

  // ── Etiquetas horas ───────────────────────────────────────
  let etiq = '';
  for (let h = 0; h <= 24; h += 6) {
    const x = PL + (h / 24) * pw;
    etiq += `<text x="${x.toFixed(1)}" y="${H-5}" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle">${String(h).padStart(2,'0')}h</text>`;
  }

  return `<div style="overflow-x:auto;">
    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      <line x1="${PL}" y1="${PT}"    x2="${PL}"   y2="${PT+ph}" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <line x1="${PL}" y1="${PT+ph}" x2="${W-PR}"  y2="${PT+ph}" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      ${refs}
      ${rects}
      <path d="${path.trim()}" fill="none" stroke="#4ecca3" stroke-width="1.4" stroke-linejoin="round"/>
      ${dots}
      ${etiq}
      <text x="${PL-4}" y="${PT+6}"   font-size="7" fill="rgba(255,255,255,0.4)" text-anchor="end">+${Y_PEAK}V</text>
      <text x="${PL-4}" y="${yCtr+3}" font-size="7" fill="rgba(255,255,255,0.35)" text-anchor="end">0V</text>
      <text x="${PL-4}" y="${PT+ph}"  font-size="7" fill="rgba(255,255,255,0.4)" text-anchor="end">-${Y_PEAK}V</text>
    </svg>
  </div>
  <div style="font-size:10px;color:rgba(255,255,255,0.35);text-align:right;margin-top:4px;">
    <span style="color:rgba(245,166,35,0.7)">▬</span> 90V bajón &nbsp;
    <span style="color:rgba(233,69,96,0.7)">▬</span> 125V subida &nbsp;
    ${tieneVoltaje ? '· datos reales' : '· voltaje estimado 110V'}
  </div>`;
}

function resumenDiario(eventosDelDia) {
  const cortes  = eventosDelDia.filter(e => esTipoFin(e.tipo));
  const alertas = eventosDelDia.filter(e => esTipoInicio(e.tipo));
  const n       = alertas.length;

  if (n === 0) return 'Sin cortes detectados este día. Comportamiento eléctrico estable durante toda la jornada.';

  let txt = n === 1
    ? 'Se registró 1 corte eléctrico durante este día. '
    : `Se registraron ${n} cortes eléctricos durante este día. `;

  if (cortes.length > 0) {
    const masLargo = cortes.reduce((m, e) => e.durSeg > m.durSeg ? e : m, cortes[0]);
    if (masLargo.durSeg > 0) {
      txt += `El corte más prolongado ocurrió a las ${formatHoraCorta(masLargo.hora)} con una duración de ${masLargo.durHMS}. `;
    }
    const total = cortes.reduce((s, e) => s + (e.durSeg || 0), 0);
    if (total > 0) {
      const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60);
      txt += `Tiempo total sin electricidad: ${h > 0 ? h + 'h ' : ''}${m}m.`;
    }
  } else if (n > 0) {
    txt += 'Los cortes no tienen duración registrada (posiblemente en curso al momento del último reporte).';
  }
  return txt;
}

function renderPronostico(r) {
  const pro  = r.pronostico || {};
  const cf   = r.conteoFranjas || {};
  const maxC = Math.max(cf['Madrugada']||0, cf['Mañana']||0, cf['Tarde']||0, cf['Noche']||0) || 1;
  return `
    <div class="pronostico-bar">
      ${['Madrugada','Mañana','Tarde','Noche'].map(f => {
        const v = cf[f] || 0;
        const h = Math.max(8, Math.round((v/maxC)*48));
        const active = f === r.franjaMaxima ? 'active' : '';
        return `<div class="pbar ${active}" style="height:${h}px"><span class="pbar-label">${f.substring(0,3)}</span></div>`;
      }).join('')}
    </div>
    <div class="pronostico-texto">${pro.texto || 'Acumulando datos para generar pronóstico...'}</div>
    ${pro.confianza ? `<div class="pronostico-confianza">Confianza: ${pro.confianza}% basada en historial</div>` : ''}
  `;
}

function calcularBateria() {
  let pct = null;
  let cargando = false;

  if (datos && datos.heartbeat && datos.heartbeat.bateria) {
    const raw = datos.heartbeat.bateria;
    if (raw === 'CHG') {
      cargando = true;
      pct = 100;  // mostrar llena mientras carga
    } else {
      const match = raw.match(/(-?\d+)/);
      if (match) {
        const n = parseInt(match[1]);
        if (n >= 0) pct = n;
      }
    }
  }

  if (pct === null) {
    return { pct: null, color: 'var(--muted)', texto: 'Sin datos de batería', cargando: false };
  }

  pct = Math.max(0, Math.min(100, pct));
  const color = cargando ? 'var(--green)'
              : pct > 50 ? 'var(--green)'
              : pct > 20 ? 'var(--yellow)'
              : 'var(--accent)';
  const texto = cargando        ? '⚡ Cargando'
              : pct > 80        ? 'Batería en buen estado'
              : pct > 50        ? 'Batería media-alta'
              : pct > 20        ? 'Batería baja'
              : 'Batería crítica';
  return { pct, color, texto, cargando };
}

// ============================================================
//  HELPERS DE FECHA Y HORA
// ============================================================
const DIAS   = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MESES  = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

function parsearFecha(h) {
  if (!h) return null;
  const s = h.toString().trim();
  if (!s || s === '--' || s === 'Sin hora') return null;

  // Intento 1: dejar que Date() lo parsee directo.
  // Maneja "Fri Jul 03 2026 16:18:14 GMT-0400 (...)" y la mayoría de formatos ISO.
  let d = new Date(s);
  if (!isNaN(d.getTime())) return d;

  // Intento 2: formato Arduino "2026-07-03 16:18:14" → reemplazar espacio por T
  d = new Date(s.replace(' ', 'T'));
  if (!isNaN(d.getTime())) return d;

  return null;
}

function formatFechaCorta(h) {
  const d = parsearFecha(h);
  if (!d) return '--';
  const dia   = String(d.getDate()).padStart(2, '0');
  const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return dia + ' ' + MESES[d.getMonth()] + ' ' + d.getFullYear();
}

function formatHoraCorta(h) {
  const d = parsearFecha(h);
  if (!d) return '--';
  // Ej: "4:18 PM"
  const hh   = d.getHours();
  const mm   = String(d.getMinutes()).padStart(2, '0');
  const ap   = hh >= 12 ? 'PM' : 'AM';
  const hh12 = hh % 12 || 12;
  return hh12 + ':' + mm + ' ' + ap;
}

function formatHora(h) {
  return formatHoraCorta(h);
}

// ============================================================
//  PUSH NOTIFICATIONS — REGISTRO REAL CON VAPID
//  Esto es lo que reemplaza al enfoque anterior (Notification API
//  en foreground). Con esto, el navegador queda suscrito a un push
//  real: el SO entrega la notificación aunque el navegador esté
//  cerrado y el celular bloqueado.
// ============================================================
async function registrarServiceWorker() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const reg = await navigator.serviceWorker.register('/sw.js');
    if (Notification.permission === 'granted') {
      await suscribirPush(reg);
    }

    // ── Escuchar mensajes del SW (push recibido mientras la app está abierta) ──
    navigator.serviceWorker.addEventListener('message', (event) => {
      if (event.data && event.data.tipo === 'PUSH_RECIBIDO') {
        manejarPushEnVivo(event.data.datos);
      }
    });
  } catch (e) {
    console.log('SW no registrado:', e);
  }
}

// ============================================================
//  ACTUALIZACIÓN EN VIVO — se ejecuta cuando el SW avisa de un push
//  mientras la página está abierta. No espera el ciclo de 60s.
// ============================================================
function manejarPushEnVivo(pushDatos) {
  const tipo      = (pushDatos.tipo || '').trim();
  const esFalla   = tipo === 'FALLA_INICIO';
  const esRetorno = tipo === 'FALLA_FIN';
  const esBajon   = tipo === 'BAJON';
  const esSubida  = tipo === 'SUBIDA';

  // 1 · Actualizar el texto grande con animación de fadeSwap
  const statusEl = document.getElementById('headerStatus');
  const descEl   = document.getElementById('headerDesc');

  if (statusEl) {
    statusEl.classList.remove('animando');
    void statusEl.offsetWidth;  // forzar reflow para reiniciar la animación
    statusEl.classList.add('animando');

    if (esFalla) {
      statusEl.textContent = '🚨Sin Electricidad';
      statusEl.className   = 'header-status sin-luz animando';
      if (descEl) descEl.textContent = pushDatos.cuerpo || 'Corte detectado';
      if (!tiempoInicioFalla) tiempoInicioFalla = new Date();
      if (!intervaloContador) intervaloContador = setInterval(actualizarContador, 1000);
      document.getElementById('contadorWrap').style.display = 'block';
      fallaActiva = true;
    } else if (esRetorno) {
      statusEl.textContent = '💡Hay Electricidad';
      statusEl.className   = 'header-status con-luz animando';
      if (descEl) descEl.textContent = pushDatos.cuerpo || 'Electricidad restaurada';
      document.getElementById('contadorWrap').style.display = 'none';
      tiempoInicioFalla = null;
      if (intervaloContador) { clearInterval(intervaloContador); intervaloContador = null; }
      fallaActiva = false;
    }
  }

  // 2 · Insertar fila animada en "Últimos eventos"
  if (vistaActual === 'inicio') {
    const lista = document.querySelector('#mainGrid .historial-list');
    if (lista) {
      const nuevoItem = document.createElement('div');
      nuevoItem.className = 'historial-item nuevo';

      let icono, etiqueta, color, valorDer;
      if      (esFalla)   { icono='⚡'; etiqueta='Corte en curso';  color='var(--yellow)'; valorDer='En curso'; }
      else if (esRetorno) { icono='⚡'; etiqueta='Corte de luz';    color='var(--green)';  valorDer='recién restaurado'; }
      else if (esBajon)   { icono='📉'; etiqueta='Bajón de luz';    color='var(--accent)'; const m=(pushDatos.cuerpo||'').match(/([\d.]+V)/); valorDer=m?m[1]:''; }
      else if (esSubida)  { icono='📈'; etiqueta='Subida de luz';   color='var(--accent)'; const m=(pushDatos.cuerpo||'').match(/([\d.]+V)/); valorDer=m?m[1]:''; }
      else                { icono='⚡'; etiqueta='Evento';           color='var(--muted)';  valorDer=''; }

      nuevoItem.innerHTML = `
        <div class="h-icon inicio">${icono}</div>
        <div class="h-body">
          <div class="h-tipo" style="color:${color}">${etiqueta}</div>
          <div class="h-hora">ahora mismo</div>
        </div>
        <div class="h-right">
          ${valorDer ? `<div class="h-dur" style="${(esBajon||esSubida)?'color:var(--accent)':''}">${valorDer}</div>` : ''}
        </div>
      `;
      lista.insertBefore(nuevoItem, lista.firstChild);
      setTimeout(() => nuevoItem.classList.remove('nuevo'), 400);
    }
  }

  // 3 · Recargar datos 3s después para sincronizar con el Sheet
  setTimeout(cargarDatos, 3000);
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function suscribirPush(registrationParam) {
  const reg = registrationParam || await navigator.serviceWorker.ready;

  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });
  }

  // Guardamos la suscripción del lado del servidor (vía Apps Script)
  await fetch('/api/subscribe', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(sub)
  });

  return sub;
}

function verificarNotificaciones() {
  const banner = document.getElementById('notifBanner');
  if (!('Notification' in window) || Notification.permission === 'granted') {
    banner.classList.add('hidden');
  }
}

async function solicitarNotificaciones() {
  if (!('Notification' in window)) {
    alert('Tu navegador no soporta notificaciones push.');
    return;
  }

  const perm = await Notification.requestPermission();

  if (perm === 'granted') {
    try {
      await suscribirPush();
      document.getElementById('notifBanner').classList.add('hidden');
      if (vistaActual === 'ajustes') renderAjustes();
    } catch (e) {
      console.error('Error al suscribirse al push:', e);
      alert('No se pudo activar el push. Revisa la consola para más detalles.');
    }
  }
}

// Prueba local: muestra una notificación usando el SW activo,
// sin pasar por el servidor — solo confirma que el permiso funciona.
async function probarNotificacion() {
  if (Notification.permission !== 'granted') {
    alert('Primero activa las notificaciones.');
    return;
  }
  const reg = await navigator.serviceWorker.getRegistration();
  if (reg) {
    reg.showNotification('⚡ Prueba ADRA', {
      body: 'Las notificaciones están funcionando correctamente',
      icon: '/icon-192.png',
      vibrate: [200, 100, 200]
    });
  } else {
    new Notification('⚡ Prueba DFL', { body: 'Las notificaciones están funcionando correctamente' });
  }
}
